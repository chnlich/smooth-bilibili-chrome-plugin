<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilibili 开发日志</title>
    <link rel="stylesheet" href="logs.css">
  </head>
  <body>
    <main>
      <h1>Bilibili 开发日志</h1>
      <p>日志只在本机扩展 IndexedDB 中追加保存；导出由你选择目标文件，新增事件不会进入已经开始的导出。</p>
      <label for="session-filter">导出范围</label>
      <select id="session-filter" data-session-filter>
        <option value="">全部 session</option>
        <option value="current">当前 session</option>
      </select>
      <p data-session-details>导出全部 session</p>
      <button type="button" data-export>打开文件并导出 JSONL</button>
      <p role="status" data-status>正在读取日志 session…</p>

      <section class="cdn-panel">
        <h2>CDN racing</h2>
        <p>按当前范围读取已保存的 bank.fetch.chunk 事件，查看各镜像在双腿 racing 中的表现。</p>
        <button type="button" data-cdn-refresh>读取 CDN racing</button>
        <p role="status" data-cdn-status>尚未读取 CDN racing。</p>
        <p data-cdn-summary>配对覆盖率和浪费字节率：未计算</p>
        <div class="cdn-table-wrap">
          <table class="cdn-table">
            <thead>
              <tr>
                <th scope="col">mirror</th>
                <th scope="col">races</th>
                <th scope="col">wins</th>
                <th scope="col">win rate</th>
                <th scope="col">ttfb p50</th>
                <th scope="col">ttfb p90</th>
                <th scope="col">stalled</th>
                <th scope="col">bytes delivered</th>
              </tr>
            </thead>
            <tbody data-cdn-rows></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="logs.js"></script>
  </body>
</html>

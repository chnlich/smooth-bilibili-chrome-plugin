<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilibili 抗卡</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Bilibili 抗卡</h1>
      <section class="preferences" aria-label="增强开关">
        <label class="switch-row">
          <span>视频增强</span>
          <input type="checkbox" data-preference="vodEnabled">
        </label>
        <p class="hint">开关是刷新后的默认值；扩展不接管播放控制。</p>
      </section>
      <section class="snapshot" aria-label="当前页面事实">
        <div class="title-row"><span>当前页面</span><strong data-status-field="mode">未提供</strong></div>
        <dl>
          <div><dt>增强状态</dt><dd data-status-field="state">未提供</dd></div>
          <div><dt>连续可播放缓存</dt><dd data-status-field="buffered">未提供</dd></div>
          <div><dt>原生缓存目标</dt><dd data-status-field="target">未提供</dd></div>
          <div><dt>有效性</dt><dd data-status-field="effective">未提供</dd></div>
          <div><dt>错误</dt><dd data-status-field="error">未提供</dd></div>
        </dl>
      </section>
      <section class="readout-section" aria-label="媒体缓冲">
        <h2>媒体缓冲</h2>
        <div data-readout-media></div>
      </section>
      <section class="readout-section" aria-label="下载层库存">
        <h2 data-readout-bank-title>下载层库存</h2>
        <div data-readout-bank></div>
      </section>
      <section class="readout-section" aria-label="镜像竞速">
        <h2>镜像竞速</h2>
        <div data-readout-race></div>
      </section>
      <section class="readout-section" aria-label="诊断">
        <h2>诊断</h2>
        <div data-readout-diagnostics></div>
      </section>
      <button type="button" data-open-logs>打开开发日志</button>
      <p class="status" data-status role="status">正在读取当前页面状态…</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
